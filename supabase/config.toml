project_id = "ggflcriakiudnejmiuwh"

[auth]
  site_url = "https://vetoschool.eu"
  additional_redirect_urls = ["https://vetoschool.eu/**"]

[auth.email]
  enable_confirmations = true
  max_frequency = "1m0s"
  otp_length = 6

[auth.mfa.totp]
  enroll_enabled = true
  verify_enabled = true

[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.create-checkout-session]
    verify_jwt = true
  [functions.create-portal-session]
    verify_jwt = true
  [functions.create-refund]
    verify_jwt = true
  [functions.generate-card-audio]
    verify_jwt = true
  [functions.process-email-queue]
    verify_jwt = true
  [functions.stripe-webhook]
    verify_jwt = false
  [functions.submit-trial-booking]
    verify_jwt = false
  [functions.telegram-notifications]
    verify_jwt = false
  [functions.telegram-webhook]
    verify_jwt = false
