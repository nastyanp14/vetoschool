<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vetoschool email code</title>
  </head>
  <body style="margin:0;background:#f8f2ff;font-family:Arial,Helvetica,sans-serif;color:#5b2aa8;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:linear-gradient(135deg,#ffe2f4 0%,#e8ddff 54%,#dff6ff 100%);padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:rgba(255,255,255,0.92);border:1px solid #f2d6ff;border-radius:28px;box-shadow:0 20px 55px rgba(120,66,180,0.18);overflow:hidden;">
            <tr>
              <td align="center" style="padding:34px 28px 12px;">
                <div style="font-size:42px;line-height:1;">📚</div>
                <h1 style="margin:18px 0 8px;font-size:30px;line-height:1.15;color:#8b35db;font-weight:800;">Добро пожаловать в Vetoschool</h1>
                <p style="margin:0;font-size:16px;line-height:1.55;color:#b15cff;">Введите этот код на странице подтверждения email.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 28px 12px;">
                <div style="display:inline-block;padding:16px 22px;border-radius:22px;background:#fff7fd;border:1px solid #ffd1ea;">
                  <div style="font-size:13px;color:#ce8cff;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;">Код подтверждения</div>
                  <div style="margin-top:8px;font-size:42px;line-height:1;font-weight:900;letter-spacing:10px;color:#7c2bd8;">{{ .Token }}</div>
                </div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:18px 34px 30px;">
                <p style="margin:0;font-size:14px;line-height:1.6;color:#8c72b7;">Если код не сработал, вернитесь на сайт и нажмите «Отправить код ещё раз». Если вы не регистрировались в Vetoschool, просто проигнорируйте это письмо.</p>
                <p style="margin:18px 0 0;font-size:13px;line-height:1.5;color:#c091db;">Vetoschool • English for kids</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
